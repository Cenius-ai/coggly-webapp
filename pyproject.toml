[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coggly"
version = "1.0.0"
description = "Clock beat-error log, pendulum length correction and service history for the bench"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["horology", "clock", "pendulum", "beat error", "regulation"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Other Audience",
    "Programming Language :: Python :: 3",
    "Topic :: Other/Nonlisted Topic",
]
dependencies = []

[project.scripts]
coggly = "coggly:main"

[tool.setuptools]
py-modules = ["coggly"]
